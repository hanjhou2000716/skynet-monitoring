<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <title>Skynet Monitoring</title>
    <!-- 補上這行，樣式才會回來！ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap');
      :root { --paper: #f5f4ef; --surface: #fbfaf7; --ink: #34332f; --muted: #77736b; --line: #dedbd3; --sage: #727a6d; --brick: #ad6658; }
      body { background: var(--paper); color: var(--ink); font-family: 'Noto Sans TC', sans-serif; }
      .bg-slate-950, .bg-slate-900, .bg-slate-900\/50 { background-color: var(--surface) !important; }
      .bg-slate-800 { background-color: #efede7 !important; }
      .border-slate-800, .border-slate-700 { border-color: var(--line) !important; }
      .text-white, .text-slate-200, .text-slate-300 { color: var(--ink) !important; }
      .text-slate-400, .text-slate-500 { color: var(--muted) !important; }
      .text-cyan-500, .text-cyan-400, .text-emerald-500, .text-emerald-400 { color: var(--sage) !important; }
      .text-indigo-400 { color: #6e6a7d !important; }
      .text-purple-400 { color: #816f69 !important; }
      .bg-emerald-950\/30, .bg-emerald-950\/40 { background-color: #edf0e9 !important; }
      .border-emerald-500\/50 { border-color: #b9c1b2 !important; }
      .bg-red-950\/40, .bg-red-950\/50 { background-color: #f7ece8 !important; }
      .border-red-500\/50 { border-color: #d9aaa0 !important; }
      .text-red-400, .text-red-500 { color: var(--brick) !important; }
      .rounded-xl, .rounded-lg, .rounded-md { border-radius: 2px !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
