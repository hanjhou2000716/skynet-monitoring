<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <title>Skynet Monitoring</title>
    <!-- 補上這行，樣式才會回來！ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap');
      :root { --paper: #f1f0eb; --surface: #fbfaf7; --ink: #23354a; --muted: #77736b; --line: #d7d4cc; --sage: #687c70; --brick: #c4674f; --orange: #c98a4b; --navy: #24425e; }
      html { background: var(--paper); }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Noto Sans TC', sans-serif; }
      .bg-slate-950, .bg-slate-900, .bg-slate-900\/50 { background-color: var(--surface) !important; }
      .bg-slate-800 { background-color: #efede7 !important; }
      .border-slate-800, .border-slate-700 { border-color: var(--line) !important; }
      .text-white, .text-slate-200, .text-slate-300 { color: var(--ink) !important; }
      .text-slate-400, .text-slate-500 { color: var(--muted) !important; }
      .text-cyan-500, .text-cyan-400 { color: var(--navy) !important; }
      .text-emerald-500, .text-emerald-400 { color: var(--sage) !important; }
      .text-indigo-400 { color: #6e6a7d !important; }
      .text-purple-400 { color: #816f69 !important; }
      .bg-emerald-950\/30, .bg-emerald-950\/40 { background-color: #edf0e9 !important; }
      .border-emerald-500\/50 { border-color: #b9c1b2 !important; }
      .bg-red-950\/40, .bg-red-950\/50 { background-color: #f7ece8 !important; }
      .border-red-500\/50 { border-color: #d9aaa0 !important; }
      .text-red-400, .text-red-500 { color: var(--brick) !important; }
      .text-amber-400, .text-orange-400 { color: var(--orange) !important; }
      a[href*="tgolaf-fin-tracker"] { background: var(--navy); color: #fff !important; border: 1px solid var(--navy); border-radius: 10px; padding: 8px 11px; margin-top: 8px; text-decoration: none; }
      .rounded-xl, .rounded-lg, .rounded-md { border-radius: 14px !important; }
      .skynet-shell { max-width: 1080px; margin: 0 auto; padding: 24px 16px 40px; }
      .skynet-header { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; padding-bottom: 18px; margin-bottom: 20px; }
      .skynet-brand { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
      .skynet-title { color: var(--navy) !important; font-family: 'Noto Serif TC', serif; font-size: clamp(24px, 5vw, 34px); line-height: 1.12; letter-spacing: .04em; }
      .skynet-subtitle { font-size: 13px; line-height: 1.55; color: var(--muted) !important; }
      .skynet-sync { flex: 0 0 auto; min-width: 190px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: right; }
      .skynet-sync strong { font-size: 12px; color: var(--ink); }
      .skynet-status { padding: 20px; border-radius: 16px !important; }
      .skynet-status h2 { font-family: 'Noto Serif TC', serif; font-size: clamp(22px, 5vw, 29px); line-height: 1.25; }
      .skynet-status p { font-size: 14px; line-height: 1.65; }
      .skynet-card { padding: 18px !important; border-radius: 16px !important; box-shadow: 0 4px 12px rgba(50,54,53,.035); }
      .skynet-card-title { font-size: clamp(17px, 3.8vw, 20px); line-height: 1.35; }
      .skynet-kpi-grid { display: grid; gap: 10px; }
      .skynet-kpi-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .skynet-kpi-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .skynet-kpi { padding: 12px; min-width: 0; background: #f4f2ed !important; border: 1px solid #e5e2db; border-radius: 10px !important; }
      .skynet-kpi-label { min-height: 32px; font-size: 11px !important; line-height: 1.35; color: var(--muted) !important; }
      .skynet-kpi-value { margin-top: 5px; font-size: clamp(18px, 4.7vw, 23px) !important; line-height: 1.15; white-space: nowrap; }
      .skynet-simulator { border-radius: 16px !important; }
      @media (max-width: 640px) {
        .skynet-shell { padding: 20px 14px 32px; }
        .skynet-header { display: block; margin-bottom: 16px; }
        .skynet-sync { margin-top: 14px; min-width: 0; width: 100%; text-align: left; }
        .skynet-status { padding: 18px; }
        .skynet-status > div { align-items: flex-start !important; }
        .skynet-kpi-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .skynet-card { padding: 16px !important; }
        .skynet-kpi { padding: 10px; }
        .skynet-kpi-label { min-height: 42px; }
        .skynet-kpi-value { font-size: 17px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
