name: Skynet Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: Install Python dependency
        run: python -m pip install yfinance
      - name: Run Python tests and syntax checks
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile tg_bot_optimized.py market_health.py schedule_gate.py
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "18"
      - name: Install frontend dependencies
        run: npm install
      - name: Run frontend contract tests
        run: npm test -- --watchAll=false --runInBand
      - name: Build React dashboard
        run: npm run build
