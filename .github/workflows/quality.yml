name: Skynet Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install locked Python dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Run Python tests and syntax checks
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile tg_bot_optimized.py market_data.py market_cache_gate.py market_diagnostic.py market_health.py schedule_gate.py
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.23.3"
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run frontend contract tests
        run: npm test -- --watchAll=false --runInBand
      - name: Build React dashboard
        run: npm run build
