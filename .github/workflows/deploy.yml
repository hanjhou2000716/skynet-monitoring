name: Deploy React App to GitHub Pages
on:
  repository_dispatch:
    types: [trigger_update]
  # Backup for the external dispatcher: 14:10 and 05:40 Asia/Taipei on
  # market weekdays. It is safe to overlap because the workflow is concurrent.
  schedule:
    - cron: "10 6 * * 1-5"
    - cron: "40 21 * * 0-4"
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance
      - name: Run Skynet Python Core
        run: python tg_bot_optimized.py
      - name: Verify generated dashboard data
        run: |
          test -s public/data.json
          test -s public/status.json
          python -m json.tool public/data.json > /dev/null
          python -m json.tool public/status.json > /dev/null
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '18'
      - name: Install Node Dependencies
        run: npm install
      - name: Build React App
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./build
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
