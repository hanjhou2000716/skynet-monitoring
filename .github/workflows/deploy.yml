name: Deploy React App to GitHub Pages
on:
  repository_dispatch:
    types: [trigger_update]
  # External Cornjob is primary at 06:40 / 14:45 Asia/Taipei. These are backups.
  schedule:
    - cron: "40 23 * * *"
    - cron: "45 7 * * *"
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: "pages"
  queue: max
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decision.outputs.run }}
      reason: ${{ steps.decision.outputs.reason }}
      window_date: ${{ steps.decision.outputs.window_date }}
      window: ${{ steps.decision.outputs.window }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.14'
      - name: Decide whether this window needs an update
        id: decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python schedule_gate.py
      - name: Record schedule gate result
        run: |
          echo "### Skynet schedule gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ steps.decision.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Taiwan window: ${{ steps.decision.outputs.window_date }} ${{ steps.decision.outputs.window }}" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.publish_gate.outputs.deploy }}
      publish_reason: ${{ steps.publish_gate.outputs.reason }}
      pages_base_url: https://${{ github.repository_owner }}.github.io/skynet-monitoring/
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.14'
      - name: Install Python Dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Restore validated official market calendar cache
        uses: actions/cache@v4
        with:
          path: .calendar-cache
          key: ${{ runner.os }}-skynet-calendar-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-skynet-calendar-v1-
      - name: Restore validated market history cache
        uses: actions/cache/restore@v4
        with:
          path: .market-cache
          key: ${{ runner.os }}-skynet-market-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-skynet-market-v1-
      - name: Run Skynet tests
        run: python -m unittest discover -s tests -v
      - name: Run Skynet Python Core
        id: core
        env:
          TARGET_WINDOW: ${{ needs.gate.outputs.window }}
          TARGET_WINDOW_DATE: ${{ needs.gate.outputs.window_date }}
        run: python tg_bot_optimized.py
      - name: Gate validated market cache update
        id: market_cache_gate
        if: steps.core.outcome == 'success'
        run: python market_cache_gate.py public/status.json
      - name: Save validated market history cache
        if: steps.core.outcome == 'success' && steps.market_cache_gate.outputs.eligible == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .market-cache
          key: ${{ runner.os }}-skynet-market-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify generated dashboard data
        run: |
          test -s public/data.json
          test -s public/status.json
          python -m json.tool public/data.json > /dev/null
          python -m json.tool public/status.json > /dev/null
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.3'
      - name: Restore compiled dashboard
        id: static_cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: ${{ runner.os }}-skynet-pages-v1-${{ hashFiles('src/**', 'public/index.html', 'package.json', 'package-lock.json') }}
      - name: Install locked Node dependencies
        if: steps.static_cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build dashboard when source changes
        if: steps.static_cache.outputs.cache-hit != 'true'
        run: npm run build
      - name: Cache compiled dashboard from main
        if: steps.static_cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ runner.os }}-skynet-pages-v1-${{ hashFiles('src/**', 'public/index.html', 'package.json', 'package-lock.json') }}
      - name: Insert this run's public market data
        run: |
          cp public/data.json build/data.json
          cp public/status.json build/status.json
      - name: Prevent an older queued run from replacing newer Pages data
        id: publish_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: python deployment_gate.py public/status.json
      - name: Stamp build with unique publication identity and content hashes
        if: steps.publish_gate.outputs.deploy == 'true'
        env:
          PUBLICATION_WINDOW_DATE: ${{ needs.gate.outputs.window_date }}
          PUBLICATION_WINDOW: ${{ needs.gate.outputs.window }}
        run: python pages_publication.py prepare build
      - name: Record Node version for diagnostics
        id: node_version
        if: always()
        run: echo "version=$(node --version 2>/dev/null || echo not-installed)" >> "$GITHUB_OUTPUT"
      - name: Write non-sensitive market diagnostic
        if: always()
        env:
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_COMMIT: ${{ github.sha }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          PUBLICATION_REASON: ${{ steps.publish_gate.outputs.reason }}
          NODE_VERSION: ${{ steps.node_version.outputs.version }}
        run: python market_diagnostic.py public/status.json "$RUNNER_TEMP/skynet-market-diagnostic.json"
      - name: Upload market diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skynet-market-diagnostic
          path: ${{ runner.temp }}/skynet-market-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload artifact
        if: steps.publish_gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./build
      - name: Upload private copy of publication manifest for verification
        if: steps.publish_gate.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skynet-publication-manifest
          path: build/publication.json
          if-no-files-found: error
  deploy:
    if: needs.build.outputs.publish == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.14'
      - name: Download publication manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: skynet-publication-manifest
          path: .private-build
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLICATION_SUMMARY_PATH: .private-build/pages-publication-summary.json
        run: python pages_publication.py publish-and-verify .private-build/publication.json
      - name: Upload Pages publication verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skynet-publication-deployment-summary
          path: .private-build/pages-publication-summary.json
          if-no-files-found: ignore

  verify-publication:
    name: Independently verify live Pages content
    needs: [build, deploy]
    if: needs.build.outputs.publish == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout read-only verifier
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.14'

      - name: Download the exact publication manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: skynet-publication-manifest
          path: .private-build

      - name: Independently verify current public content
        env:
          PAGES_BASE_URL: ${{ needs.build.outputs.pages_base_url }}
          PUBLICATION_SUMMARY_PATH: .private-build/independent-publication-verification.json
        run: python pages_publication.py verify-live .private-build

      - name: Upload independent publication verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skynet-publication-verification
          path: .private-build/independent-publication-verification.json
          if-no-files-found: ignore
